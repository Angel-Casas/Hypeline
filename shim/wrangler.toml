name = "hypeline-shim"
main = "worker.js"
compatibility_date = "2026-09-01"

# The relay's own subdomain. `*.workers.dev` is blocked by some corporate DNS, ad blockers
# and browser extensions, and when it is, the app looks broken rather than blocked
# (2026-09-16). A custom domain avoids that, and `wrangler deploy` creates both the route and
# its DNS record — the zone must be on the same Cloudflare account (hypeline.live moved there
# 2026-09-17). Deleting this block does not remove the domain; do that in the dashboard.
# Self-hosting on a domain of your own? Change it, or delete it and use *.workers.dev.
[[routes]]
pattern = "relay.hypeline.live"
custom_domain = true

[vars]
# The origins allowed to use this relay. The live app, and nothing else — `ALLOW_LOCAL`
# covers development. "*" would let any site use it.
ALLOWED_ORIGINS = "https://hypeline.live"
# Also allow localhost / 127.0.0.1 / private-LAN origins, so `vite dev`, `vite preview` and a
# phone on the same wifi keep working. Set to "false" if you would rather list them by hand.
ALLOW_LOCAL = "true"
# Requests per minute per IP. A 60 s clip at source quality is ~7 segment
# requests + 2 playlists; 120/min is generous for one person, tight for abuse.
RATE_LIMIT_RPM = "120"

# Cloudflare's own rate limiter: counted across the edge, unlike the in-isolate fallback in
# worker.js. `limit` should match RATE_LIMIT_RPM above; `period` may only be 10 or 60.
# Needs wrangler 4.36+.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60
