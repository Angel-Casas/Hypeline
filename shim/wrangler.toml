name = "hypeline-shim"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Lock this down to your app origin(s) before sharing the URL, e.g.
# "http://localhost:5173,https://hypeline.pages.dev"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
# Requests per minute per IP. A 60 s clip at source quality is ~7 segment
# requests + 2 playlists; 120/min is generous for one person, tight for abuse.
RATE_LIMIT_RPM = "120"

# Optional: Workers Rate Limiting binding (more accurate than the in-isolate
# fallback). Uncomment to use; `limit` must match RATE_LIMIT_RPM.
# [[unsafe.bindings]]
# name = "LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 120, period = 60 }
