<title>Hypeline Axis Motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --petal: #ffd0e4; --apricot: #ffdcc4; --butter: #fff0bd; --sky: #cfdcff; --lilac: #ddd0ff; --ink-2: #3b3444; --ground: #fbf9fa; --ink: #221c2a; --muted: #6f6779; --glass: rgba(255,255,255,0.4); --glass-line: rgba(255,255,255,0.85);

  #rail { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 30; display: grid; grid-template-columns: 1fr; gap: 2px 6px; padding: 8px; border-radius: 16px; } #rail .hint { grid-column: 1 / -1; }
  #rail button { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: center; text-align: left; border: 0; background: transparent; padding: 4px 8px 4px 4px; border-radius: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  #rail button b { font-weight: 500; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(34,28,42,.25); }
  #rail button[aria-current="true"] { background: var(--ink); color: #fff; } #rail button[aria-current="true"] b { border-color: transparent; background: rgba(255,255,255,.2); }
  #rail .hint { font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding: 6px 8px 2px; }
  @media (max-width: 900px) { #rail { left: 8px; bottom: 8px; top: auto; transform: none; flex-direction: row; flex-wrap: wrap; max-width: calc(100vw - 16px); } #rail button span, #rail .hint { display: none; } }
  .hud { position: fixed; right: 28px; bottom: 24px; z-index: 30; font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 14px; padding: 8px 12px; border-radius: 999px; }
  .hud b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  #stage .track { height: 280vh; } #stage .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .layout { position: absolute; inset: 0; display: none; } .layout.on { display: block; }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--display); font-weight: 400; line-height: .98; letter-spacing: -.02em; margin: 0; text-wrap: balance; }

  .field button { border: 0; border-radius: 12px; background: var(--ink); color: #fff; padding: 10px 16px; font-family: var(--body); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }

  .moment { position: absolute; width: 212px; padding: 13px 15px; opacity: 0; transform: translate(-50%, -100%) translateY(10px); transition: opacity .5s, transform .5s cubic-bezier(.2,.7,.2,1); }
  .moment.on { opacity: 1; transform: translate(-50%, -100%); }
      .moment .t { font-family: var(--mono); font-size: 10.5px; color: var(--muted); } .moment .q { font-family: var(--display); font-size: 22px; line-height: 1.05; margin-top: 4px; } .moment .s { font-size: 12px; margin-top: 5px; color: #3b3444; }
  .moment.dot { width: auto; padding: 5px 9px; border-radius: 999px; transform: translate(-50%, -100%) translateY(6px); font-family: var(--mono); font-size: 11px; } .moment.dot .q, .moment.dot .s { display: none; } .moment.dot .t { color: var(--ink); }
  .moment.dot.on { transform: translate(-50%, -100%); }
  .moment.side { transform: translate(-100%, -50%) translateX(-10px); } .moment.side.on { transform: translate(-100%, -50%); }
  .moment.below { transform: translate(-50%, 0) translateY(-8px); } .moment.below.on { transform: translate(-50%, 0); } .moment.dot.below { transform: translate(-50%, 0) translateY(-6px); } .moment.dot.below.on { transform: translate(-50%, 0); }
  .thesis { position: fixed; right: 28px; bottom: 66px; max-width: 340px; padding: 12px 14px; font-size: 13px; color: #3b3444; z-index: 5; }
  .thesis b { display: block; font-family: var(--mono); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }

  /* 01 classic */
  .l1 .copy { position: absolute; left: 240px; bottom: 64px; max-width: 520px; } .l1 h1 { font-size: clamp(38px, 4.6vw, 62px); margin-top: 10px; } .l1 .lead { font-size: 16px; max-width: 46ch; margin-top: 12px; } .l1 .field { margin-top: 18px; max-width: 460px; }
  .l1 .brand { position: absolute; left: 28px; top: 20px; }

  .l2 .bottom { position: absolute; left: 0; right: 0; bottom: 8vh; display: flex; flex-direction: column; align-items: center; gap: 12px; } .l2 .field { width: min(560px, 90vw); } .l2 .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  /* 03 split */
  .l3 .panel { position: absolute; left: 200px; top: 50%; transform: translateY(-50%); width: min(520px, 40vw); padding: 36px; } .l3 h1 { font-size: clamp(34px, 3.6vw, 52px); margin-top: 10px; } .l3 .lead { font-size: 15px; margin-top: 12px; } .l3 .field { margin-top: 18px; } .l3 .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  /* 04 masthead */
  .l4 .head { position: absolute; left: 0; right: 0; top: 3vh; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; pointer-events: none; }
  .l4 .mast { font-family: var(--display); font-size: clamp(60px, 11vw, 168px); line-height: 1.04; padding-bottom: .08em; letter-spacing: -.03em; color: var(--ink); }
  .l4 .deck { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12vh; text-align: center; max-width: 640px; padding: 0 24px; } .l4 .deck h1 { font-size: clamp(19px, 2.1vw, 28px); font-family: var(--body); font-weight: 500; letter-spacing: 0; line-height: 1.3; }
  .l4 .bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 4vh; width: min(720px, 92vw); display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; border-radius: 999px; } .l4 .bar .field { flex: 1; padding: 0; background: transparent; border: 0; box-shadow: none; backdrop-filter: none; } .l4 .bar .field button { border-radius: 999px; }
  /* 05 underline */
  .l5 .copy { position: absolute; left: 220px; top: 12vh; max-width: 1100px; } .l5 h1 { font-size: clamp(54px, 8.4vw, 124px); line-height: 1.02; } .l5 .row { display: flex; gap: 40px; align-items: flex-start; margin-top: 30vh; flex-wrap: wrap; } .l5 .lead { font-size: 16px; max-width: 42ch; } .l5 .field { width: min(460px, 90vw); }
  /* 06 poster */
  .l6 .corner { position: absolute; left: 220px; top: 22px; display: flex; gap: 18px; align-items: baseline; } .l6 .num { position: absolute; left: 220px; bottom: 8vh; font-family: var(--mono); font-weight: 500; font-size: clamp(72px, 11vw, 180px); line-height: .9; letter-spacing: -.06em; color: var(--ink); }
  .l6 .num small { display: block; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .l6 .cta { position: absolute; right: 28px; top: 9vh; width: min(420px, 80vw); padding: 22px; } .l6 .cta h1 { font-size: 26px; } .l6 .cta .lead { font-size: 14px; margin-top: 8px; } .l6 .cta .field { margin-top: 14px; }

  .l7 .card .t { font-family: var(--mono); font-size: 10.5px; color: var(--muted); } .l7 .card .q { font-family: var(--display); font-size: 24px; line-height: 1.05; margin-top: 6px; } .l7 .card .s { font-size: 12px; color: #3b3444; margin-top: 8px; } .l7 .card img { width: 100%; border-radius: 10px; margin-top: 10px; aspect-ratio: 9/16; object-fit: cover; max-height: 160px; }
  /* 08 vertical */
  .l8 .copy { position: absolute; left: 220px; top: 50%; transform: translateY(-50%); max-width: 500px; } .l8 h1 { font-size: clamp(40px, 5vw, 70px); margin-top: 10px; } .l8 .lead { font-size: 16px; margin-top: 12px; max-width: 42ch; } .l8 .field { margin-top: 18px; max-width: 440px; }
  /* 09 chat first */
  .l9 .copy { position: absolute; left: 220px; top: 12vh; max-width: 520px; } .l9 h1 { font-size: clamp(38px, 4.4vw, 60px); margin-top: 10px; } .l9 .lead { font-size: 15px; margin-top: 12px; } .l9 .field { margin-top: 16px; max-width: 440px; }
  .l9 .chat { position: absolute; right: 28px; top: 8vh; width: min(380px, 40vw); padding: 14px; display: flex; flex-direction: column; gap: 8px; } .l9 .chat .m { font-size: 13px; opacity: .18; transition: opacity .4s; } .l9 .chat .m.on { opacity: 1; } .l9 .chat .m b { font-family: var(--mono); font-weight: 500; font-size: 10.5px; color: var(--muted); margin-right: 6px; }
  .l9 .chat .m.hot { background: rgba(255,255,255,.55); border-radius: 10px; padding: 6px 8px; margin: 2px -4px; }
  /* 10 minimal */

  .l10 .under { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16vh; width: min(540px, 88vw); } .l10 .under .field { background: transparent; border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0; box-shadow: none; backdrop-filter: none; padding: 0 0 6px; } .l10 .under .field button { background: transparent; color: var(--ink); text-decoration: underline; text-underline-offset: 5px; padding: 10px 0; }
  .l10 .foot { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8vh; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ---- Tab + Pin card (the chosen design) ---- */
  .moment { width: 212px; padding: 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 0; opacity: 1; transform: translate(-50%, -100%); transition: none; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .moment .box { position: relative; width: 100%; padding: 16px 15px 10px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); box-shadow: 0 24px 60px rgba(34,28,42,.10), inset 0 1px 0 #fff; border-radius: 18px; will-change: transform, opacity; }
  .moment .t { position: absolute; top: -11px; left: 12px; background: var(--ink); color: #fff; padding: 3px 9px; border-radius: 999px; font-size: 10px; }
  .moment .stem { width: 1px; height: 20px; background: var(--ink); transform-origin: bottom center; }
  .moment .knob { width: 7px; height: 7px; margin-top: -1px; border-radius: 50%; background: var(--ink); }
  .moment .box, .moment .stem, .moment .knob, .moment .t, .moment .q, .moment .s { transition-timing-function: cubic-bezier(.2,.7,.2,1); }
  /* 01 rise: fade + drop into place (the current one, with the glass layer pre-promoted so the blur is there from the first frame) */
  body[data-a="1"] .moment .box, body[data-a="1"] .moment .stem, body[data-a="1"] .moment .knob { transition: opacity .5s, transform .5s; }
  body[data-a="1"] .moment:not(.on) .box, body[data-a="1"] .moment:not(.on) .stem, body[data-a="1"] .moment:not(.on) .knob { opacity: 0; transform: translateY(-12px); }
  /* 02 pin first: the dot lands, the stem grows up, then the card unfolds from the stem */
  body[data-a="2"] .moment .knob { transition: transform .25s, opacity .25s; }
  body[data-a="2"] .moment .stem { transition: transform .3s .2s; }
  body[data-a="2"] .moment .box { transform-origin: bottom center; transition: transform .45s .4s, opacity .3s .4s; }
  body[data-a="2"] .moment:not(.on) .knob { transform: scale(0); opacity: 0; transition-delay: .45s; }
  body[data-a="2"] .moment:not(.on) .stem { transform: scaleY(0); transition-delay: .25s; }
  body[data-a="2"] .moment:not(.on) .box { transform: scaleY(0); opacity: 0; transition-delay: 0s; }
  /* 03 pop: springs out of the dot with a little overshoot */
  body[data-a="3"] .moment .box { transform-origin: bottom center; transition: transform .6s cubic-bezier(.34,1.56,.64,1), opacity .25s; }
  body[data-a="3"] .moment .stem, body[data-a="3"] .moment .knob { transition: opacity .25s; }
  body[data-a="3"] .moment:not(.on) .box { transform: scale(.4); opacity: 0; transition: transform .3s cubic-bezier(.4,0,1,1), opacity .2s; }
  body[data-a="3"] .moment:not(.on) .stem, body[data-a="3"] .moment:not(.on) .knob { opacity: 0; }
  /* 04 unfold: the card hinges down from its top edge, like a sign flipping open */
  body[data-a="4"] .moment { perspective: 600px; }
  body[data-a="4"] .moment .box { transform-origin: top center; transition: transform .6s, opacity .3s; }
  body[data-a="4"] .moment .stem, body[data-a="4"] .moment .knob { transition: opacity .3s .3s; }
  body[data-a="4"] .moment:not(.on) .box { transform: rotateX(-90deg); opacity: 0; }
  body[data-a="4"] .moment:not(.on) .stem, body[data-a="4"] .moment:not(.on) .knob { opacity: 0; transition-delay: 0s; }
  /* 05 wipe: the pill first, then the card is wiped in left to right */
  body[data-a="5"] .moment .box { transition: clip-path .5s .15s, opacity .2s .15s; clip-path: inset(-14px -2px -2px -2px round 18px); }
  body[data-a="5"] .moment .t { transition: transform .3s, opacity .3s; }
  body[data-a="5"] .moment .stem, body[data-a="5"] .moment .knob { transition: opacity .3s .5s; }
  body[data-a="5"] .moment:not(.on) .box { clip-path: inset(-14px 100% -2px -2px round 18px); opacity: 0; transition-delay: 0s; }
  body[data-a="5"] .moment:not(.on) .t { transform: translateX(-8px); opacity: 0; }
  body[data-a="5"] .moment:not(.on) .stem, body[data-a="5"] .moment:not(.on) .knob { opacity: 0; transition-delay: 0s; }
  /* 06 bloom: scales up from the dot while coming into focus (blur → sharp) */
  body[data-a="6"] .moment .box { transform-origin: bottom center; transition: transform .55s, opacity .35s, filter .55s; }
  body[data-a="6"] .moment .stem, body[data-a="6"] .moment .knob { transition: opacity .3s; }
  body[data-a="6"] .moment:not(.on) .box { transform: scale(.7) translateY(14px); opacity: 0; filter: blur(10px); }
  body[data-a="6"] .moment:not(.on) .stem, body[data-a="6"] .moment:not(.on) .knob { opacity: 0; }
  /* 07 lift: the card slides up out of the thread along the stem, clipped at the dot */
  body[data-a="7"] .moment { overflow: visible; }
  body[data-a="7"] .moment .box { transition: transform .55s, opacity .3s; }
  body[data-a="7"] .moment .stem { transition: transform .55s; }
  body[data-a="7"] .moment:not(.on) .box { transform: translateY(40px) scale(.96); opacity: 0; }
  body[data-a="7"] .moment:not(.on) .stem { transform: scaleY(0); }
  /* 08 ripple: the dot sends a ring, then the card fades in above; leaving, it sinks into the dot */
  body[data-a="8"] .moment .knob { position: relative; transition: transform .3s; }
  body[data-a="8"] .moment .knob::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 1px solid var(--ink); opacity: 0; }
  body[data-a="8"] .moment.on .knob::after { animation: ring .9s ease-out 1; }
  @keyframes ring { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(6); opacity: 0; } }
  body[data-a="8"] .moment .box { transform-origin: bottom center; transition: transform .5s .35s, opacity .4s .35s; }
  body[data-a="8"] .moment .stem { transition: transform .35s .2s; }
  body[data-a="8"] .moment:not(.on) .box { transform: translateY(24px) scale(.3); opacity: 0; transition-delay: 0s; }
  body[data-a="8"] .moment:not(.on) .stem { transform: scaleY(0); transition-delay: 0s; }
  body[data-a="8"] .moment:not(.on) .knob { transform: scale(0); }
  /* 09 type: the box appears, then the title is typed out letter by letter */
  body[data-a="9"] .moment .box { transition: opacity .3s, transform .3s; }
  body[data-a="9"] .moment .q span { display: inline-block; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
  body[data-a="9"] .moment.on .q span { opacity: 1; transform: none; transition-delay: calc(.2s + var(--i) * .035s); }
  body[data-a="9"] .moment .s { transition: opacity .3s; } body[data-a="9"] .moment.on .s { transition-delay: .9s; }
  body[data-a="9"] .moment .stem, body[data-a="9"] .moment .knob { transition: opacity .3s; }
  body[data-a="9"] .moment:not(.on) .box { opacity: 0; transform: translateY(-8px); }
  body[data-a="9"] .moment:not(.on) .s, body[data-a="9"] .moment:not(.on) .stem, body[data-a="9"] .moment:not(.on) .knob { opacity: 0; }
  /* 10 stagger: pin, stem, box, then pill / title / sub each rise in turn */
  body[data-a="10"] .moment .knob { transition: transform .25s, opacity .25s; }
  body[data-a="10"] .moment .stem { transition: transform .25s .12s; }
  body[data-a="10"] .moment .box { transition: opacity .3s .25s, transform .4s .25s; }
  body[data-a="10"] .moment .t { transition: opacity .3s .4s, transform .3s .4s; }
  body[data-a="10"] .moment .q { transition: opacity .3s .5s, transform .3s .5s; }
  body[data-a="10"] .moment .s { transition: opacity .3s .6s, transform .3s .6s; }
  body[data-a="10"] .moment:not(.on) .knob { transform: scale(0); opacity: 0; transition-delay: .3s; }
  body[data-a="10"] .moment:not(.on) .stem { transform: scaleY(0); transition-delay: .2s; }
  body[data-a="10"] .moment:not(.on) .box { opacity: 0; transform: translateY(-10px); transition-delay: .1s; }
  body[data-a="10"] .moment:not(.on) .t, body[data-a="10"] .moment:not(.on) .q, body[data-a="10"] .moment:not(.on) .s { opacity: 0; transform: translateY(6px); transition-delay: 0s; }

  /* ---- axis motion (body[data-x]) ---- */
  .axis { position: absolute; left: 4%; right: 4%; height: 18px; font-family: var(--mono); font-size: 11px; color: var(--muted); pointer-events: none; }
  .axis .lab { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; transition: opacity .4s, transform .5s cubic-bezier(.2,.7,.2,1), color .4s, font-weight .3s; }
  .axis .lab:first-child { transform: none; } .axis .lab:last-child { transform: translateX(-100%); }
  .axis .rule, .axis .cur, .axis .odo, .axis .ticks, .axis .sweep { position: absolute; display: none; }
  .axis .rule { top: -8px; left: 0; height: 1px; background: var(--ink); width: calc(var(--p) * 100%); }
  .axis .cur { top: -10px; left: calc(var(--p) * 100%); transform: translateX(-50%); color: var(--ink); background: var(--ground); padding: 0 4px; }
  .axis .cur::before { content: ""; position: absolute; left: 50%; top: -8px; width: 1px; height: 7px; background: var(--ink); }
  .axis .ticks { top: -7px; left: 0; right: 0; height: 6px; background-image: repeating-linear-gradient(90deg, rgba(34,28,42,.35) 0 1px, transparent 1px calc(100% / 38.4)); background-size: 100% 4px; background-repeat: no-repeat; clip-path: inset(0 calc((1 - var(--p)) * 100%) 0 0); }
  .axis .sweep { top: 2px; left: 0; height: 13px; width: calc(var(--p) * 100%); background: linear-gradient(90deg, var(--petal), var(--lilac), var(--apricot), var(--butter)); opacity: .7; z-index: -1; border-radius: 2px; }

  document.querySelectorAll('.layout').forEach((lay) => { const host = lay.querySelector('.cards'); if (!host) return; const TINT = ['var(--petal)','var(--lilac)','var(--apricot)','var(--butter)']; PEAKS.forEach(([t,h,a,b,c], i) => { const d = document.createElement('div'); d.className = 'moment glass'; d.dataset.t = t; d.dataset.h = h; d.style.setProperty('--c', TINT[i]); const x = (a.match(/([\d.]+×)/) || [])[1] || ''; d.innerHTML = `<div class="box"><div class="t">${a}</div><div class="q">${[...b].map((ch, k) => `<span style="--i:${k}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</div><div class="s">${c}</div></div><div class="stem"></div><div class="knob"></div>`; host.appendChild(d); }); });
  
  
  function setMode(m) { mode = 1; document.querySelector('.layout').classList.add('on'); tick(); }
  const rail = document.getElementById('rail'); const thesis = document.getElementById('thesis');
  FX.forEach((f, i) => { const b = document.createElement('button'); b.setAttribute('role', 'tab'); b.innerHTML = `<b>${i+1}</b><span>${f.n}</span>`; b.addEventListener('click', () => setFx(i+1)); rail.appendChild(b); });
  function setFx(i) { card = i; [...rail.querySelectorAll('button')].forEach((b, j) => b.setAttribute('aria-current', String(j+1 === i))); thesis.innerHTML = `<b>0${i} · ${FX[i-1].n}</b>${FX[i-1].t}`; document.body.dataset.a = 10; document.body.dataset.x = i; scrollTo({ top: 0 }); setTimeout(() => scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 250); try { history.replaceState(null, '', '#x' + i); } catch (e) {} }
  let hold = 0;
  function replay() { scrollTo({ top: 0 }); setTimeout(() => scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 250); }
  document.getElementById('replay').addEventListener('click', replay);
  addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); replay(); } if (e.key === 'ArrowRight' || e.key === 'ArrowDown') setFx(card % 10 + 1); if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') setFx((card + 8) % 10 + 1); });
  setFx(Number((location.hash.match(/#x(\d+)/) || [])[1]) || 1);
  
  const track = document.querySelector('[data-track]'); const hudP = document.getElementById('hud-p'), hudN = document.getElementById('hud-n');
  const sq = (v) => v*v; const hype = (t) => 0.22*Math.exp(-sq((t-0.12)*30)) + 0.95*Math.exp(-sq((t-0.29)*19)) + 0.32*Math.exp(-sq((t-0.50)*26)) + 0.72*Math.exp(-sq((t-0.68)*18)) + 0.40*Math.exp(-sq((t-0.85)*26));
  function place(l, T, h) { // point above (or below) the thread at T, in screen fractions

    const wid = (0.015 + 0.21*h) * l.scale; const qx = (x0 + T*(x1 - x0)) * aspect, qy = l.cy + (l.below ? -(wid*0.5 + 0.004) : wid*0.5 + 0.004);

  }
  const fmt = (sec) => `${Math.floor(sec/3600)}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
  const HUES = ['#ff77b5','#af84ff','#ffa969','#ffde69'];
  function axisTick(ax, p) {

    const tipSec = p * LEN; const labs = [...ax.querySelectorAll('.lab')];
    let hot = null, hotD = 1;
    labs.forEach((el) => { const sec = Number(el.dataset.sec); const T = sec / LEN; const passed = p >= T - 0.001; el.classList.toggle('passed', passed);
      const d = Math.abs(p - T); const near = Math.max(0, 1 - d / 0.08); el.style.setProperty('--near', near.toFixed(3)); if (d < hotD) { hotD = d; hot = el; }
      if (x === '2') { const shown = passed ? sec : Math.max(0, Math.min(sec, (p - (T - 0.12)) / 0.12 * sec)); el.textContent = fmt(shown); el.classList.toggle('done', passed); } else if (el.textContent !== fmt(sec)) el.textContent = fmt(sec); });
    labs.forEach((el) => el.classList.toggle('hot', el === hot && hotD < 0.08 && p > 0.001));
    const hueIdx = Math.min(3, Math.floor(p * 4)); ax.style.setProperty('--hue', HUES[hueIdx]);
    const cur = ax.querySelector('.cur'); cur.textContent = fmt(tipSec);
    const odo = ax.querySelector('.odo'); const str = fmt(tipSec); if (odo.children.length !== str.length) odo.innerHTML = [...str].map((ch) => /\d/.test(ch) ? `<i><b>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</b></i>` : `<span>${ch}</span>`).join('');
    let k = 0; [...str].forEach((ch) => { if (/\d/.test(ch)) { odo.children[k].firstChild.style.setProperty('--d', ch); } k++; });
  }
  function tick() {
    const vh = innerHeight, r = track.getBoundingClientRect(); prog = Math.max(0, Math.min(1, (0 - r.top) / (r.height - vh)));
    const l = L[mode-1]; const lay = document.querySelector('.layout.on'); let n = 0;
    lay.querySelectorAll('.moment').forEach((c) => { const T = Number(c.dataset.t), h = Number(c.dataset.h); const on = prog > T + 0.01 && l.cards !== 'none'; c.classList.toggle('on', on); c.classList.toggle('dot', l.cards === 'dot'); c.classList.toggle('side', l.cards === 'side'); c.classList.toggle('below', !!l.below); c.style.display = l.cards === 'none' ? 'none' : '';
      let [x, y] = place(l, T, h); if (l.cards === 'side') { x -= 0.02; } x = Math.max(0.12, Math.min(0.88, x)); c.style.left = (x*100) + '%'; c.style.top = (y*100) + '%'; });
    lay.querySelectorAll('.card, .m').forEach((el) => el.classList.toggle('on', prog > Number(el.dataset.t) + 0.01));
    PEAKS.forEach(([t]) => { if (prog > t + 0.01) n++; });
    const ax = lay.querySelector('.axis'); if (ax) { ax.style.top = ((l.axis ?? 0.42)*100) + '%'; if (!ax.children.length) { const LEN = 23042; const marks = [0,3600,7200,10800,14400,18000,21600,LEN]; ax.innerHTML = marks.map((sec, i) => `<span class="lab" data-sec="${sec}" style="left:${(sec/LEN*100).toFixed(3)}%;--dir:${i%2?1:-1}">${fmt(sec)}</span>`).join('') + '<div class="rule"></div><div class="cur"></div><div class="ticks"></div><div class="sweep"></div><div class="odo"></div>'; ax.style.left = (l.x0*100) + '%'; ax.style.right = ((1 - l.x1)*100) + '%'; }

    hudP.textContent = Math.round(prog*100) + '%'; hudN.textContent = String(n);
  }
  addEventListener('scroll', tick, { passive: true }); addEventListener('resize', tick);
  setMode(1);
})();
